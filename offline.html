<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>You're offline - Darius Poultry Supplies</title>
    <style>
        :root { color-scheme: light dark; }
        body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f4f6fa; color: #1e293b; text-align: center; }
        .card { max-width: 360px; padding: 32px 24px; border-radius: 18px; background: #fff; box-shadow: 0 10px 30px rgba(15, 23, 42, .1); }
        .icon { font-size: 44px; line-height: 1; margin-bottom: 12px; }
        h1 { font-size: 1.3rem; margin: 0 0 8px; }
        p { margin: 0 0 20px; color: #64748b; line-height: 1.5; }
        button { padding: 12px 22px; border: 0; border-radius: 12px; background: #4f46e5; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
        @media (prefers-color-scheme: dark) {
            body { background: #0f172a; color: #e2e8f0; }
            .card { background: #1e293b; box-shadow: none; }
            p { color: #94a3b8; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon" aria-hidden="true">📶</div>
        <h1>You're offline</h1>
        <p>Check your mobile data or Wi-Fi, then try again.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
