<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ffe3e3 0%, #ffd1d1 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: relative;
        }
        .card {
            background: rgba(255, 255, 255, 0.85);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(228, 48, 84, 0.15);
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            z-index: 10;
            transform: scale(0.9);
            animation: pulseCard 3s ease-in-out infinite;
        }
        h1 {
            color: #d63031;
            font-size: 3rem;
            margin-bottom: 15px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        p {
            color: #636e72;
            font-size: 1.2rem;
            line-height: 1.6;
        }
        .big-heart {
            color: #e84393;
            font-size: 4rem;
            margin-top: 15px;
            animation: beat 1s infinite alternate;
        }
        @keyframes beat {
            to { transform: scale(1.2); }
        }
        @keyframes pulseCard {
            0%, 100% { transform: scale(0.95); }
            50% { transform: scale(1); }
        }
        /* Floating background elements */
        .heart-float {
            position: absolute;
            color: rgba(232, 67, 147, 0.3);
            font-size: 1.5rem;
            bottom: -50px;
            animation: floatUp var(--duration) linear infinite;
            left: var(--left-pos);
        }
        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>I Love You ❤️</h1>
        <p>You make my world a much brighter place.</p>
        <div class="big-heart">❤️</div>
    </div>

    <script>
        // Creates the floating background hearts
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-float');
            heart.innerHTML = '❤️';
            
            // Randomize position and timing properties
            heart.style.setProperty('--left-pos', Math.random() * 100 + 'vw');
            heart.style.setProperty('--duration', (Math.random() * 3 + 3) + 's');
            heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
            
            document.body.appendChild(heart);
            
            // Cleanup to save computer memory
            setTimeout(() => {
                heart.remove();
            }, 6000);
        }

        // Generate a new heart every 400 milliseconds
        setInterval(createHeart, 400);
    </script>
</body>
</html>
