<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Miss You</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ffe5ec, #ffc2d1);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .card {
            background: rgba(255, 255, 255, 0.85);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            max-width: 90%;
            width: 400px;
            z-index: 10;
            animation: floatCard 4s ease-in-out infinite;
        }

        h1 {
            color: #ff477e;
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        p {
            color: #6c757d;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .heart-icon {
            font-size: 4rem;
            color: #ff477e;
            margin-bottom: 20px;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }

        /* Card floating animation */
        @keyframes floatCard {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Heart beating animation */
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        /* Background floating hearts simulation */
        .hearts-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .floating-heart {
            position: absolute;
            color: rgba(255, 71, 126, 0.2);
            font-size: 1.5rem;
            animation: floatUp 6s linear infinite;
            bottom: -50px;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Background Hearts -->
    <div class="hearts-bg">
        <div class="floating-heart" style="left: 10%; animation-delay: 0s; font-size: 2rem;">❤️</div>
        <div class="floating-heart" style="left: 25%; animation-delay: 2s;">❤️</div>
        <div class="floating-heart" style="left: 55%; animation-delay: 1s; font-size: 2.5rem;">❤️</div>
        <div class="floating-heart" style="left: 70%; animation-delay: 3s;">❤️</div>
        <div class="floating-heart" style="left: 85%; animation-delay: 0.5s;">❤️</div>
    </div>

    <!-- Main Message Card -->
    <div class="card">
        <div class="heart-icon">❤️</div>
        <h1>I Miss You</h1>
        <p>Every day feels a little bit emptier without you around. Can't wait until we can hang out again!</p>
    </div>

</body>
</html>
